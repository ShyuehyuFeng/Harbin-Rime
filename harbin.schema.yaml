# Rime schema
# encoding: utf-8

schema:
  schema_id: harbin
  name: Harbin
  version: "26.9.14"
  author:
    - ShyuehyuFeng
  description: Chinese
  dependencies:
    - luna_pinyin

switches:
  - name: ascii_mode
    reset: 0
    states: [CHIN, ENGL]
  - name: half_shape
    states: [FLSP, HFSP]
  - name: simplified
    reset: 0
    states: [TRAD, SIMP]
  - name: taiwan
    reset: 0
    states: [TRCN, TRTW]
  - name: ascii_punct
    states: [FLPT, HFPT]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
    - reverse_lookup_translator
  filters:
    - simplifier@t2s
    - simplifier@t2tw
    - uniquifier

# ========== Traditional -> Simplified ==========
# Applied when simplified = 1.
t2s:
  opencc_config: t2s.json
  option_name: simplified
  tips: none

# ========== Traditional -> Taiwan Traditional ==========
# Applied when taiwan = 1.
t2tw:
  opencc_config: t2tw.json
  option_name: taiwan
  tips: none

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  algebra:
    - "xform/'//"

    # 1. Strip the final tone letter to create a tone-less spelling.
    - derive/^([a-z]+)[wqvx]$/$1/

    # 2. "c" is an alias for "ts".
    - derive/^ts/c/

    # 3. "r" is an alias for "rh".
    - derive/^rh/r/

    # 4. "dz" is an alias for "z".
    - derive/^z/dz/

    # 5. "e" is an alias for "eh" anywhere in the syllable.
    - derive/eh/e/

translator:
  dictionary: harbin
  always_show_comments: true
  spelling_hints: 8

reverse_lookup:
  dictionary: luna_pinyin
  prefix: "`"
  suffix: "'"
  tips: [PinIn]
  preedit_format:
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/
    - xform/([jqxy])v/$1u/

punctuator:
  import_preset: default

key_binder:
  import_preset: default

recognizer:
  import_preset: default
  patterns:
    reverse_lookup: "`[a-z]*'?$"